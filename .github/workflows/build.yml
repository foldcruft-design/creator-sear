name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug / all)'
        required: false
        default: 'all'
        type: choice
        options:
          - debug
          - all

permissions:
  contents: read

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Prepare Environment & Keystore
        run: |
          # Create empty .env to satisfy Secrets Gradle Plugin
          touch .env

          # Restore debug.keystore from base64 if present, or generate one
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fresh debug.keystore..."
              keytool -genkey -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APKs (Debug & Release)
        run: |
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace

      - name: Dual-Sign APKs (v1 JAR Signatures + v2/v3 APK Schemes)
        run: |
          echo "Signing all generated APKs to guarantee compatibility with all Android versions and package installers..."
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Build-Tools from: $BUILD_TOOLS_DIR"

          for apk in $(find app/build/outputs/apk -name "*.apk"); do
            echo "----------------------------------------"
            echo "Processing APK: $apk"
            
            # Step 1: Add v1 JAR signature files (META-INF/*.SF and META-INF/*.RSA)
            echo "Applying v1 (JAR signing) with jarsigner..."
            jarsigner -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              "$apk" androiddebugkey

            # Step 2: Apply v2 and v3 signatures using apksigner
            echo "Applying v2/v3 APK schemes with apksigner..."
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$apk"

            # Step 3: Verify signature integrity
            echo "Verifying signature:"
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$apk"
            echo "----------------------------------------"
          done

      - name: Verify APK Integrity
        run: |
          echo "Checking APK outputs:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokEnhance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokEnhance-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
