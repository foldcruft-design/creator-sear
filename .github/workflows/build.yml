name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug / all)'
        required: false
        default: 'all'
        type: choice
        options:
          - debug
          - all

permissions:
  contents: read

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Prepare Environment & Keystore
        run: |
          # Create empty .env to satisfy Secrets Gradle Plugin
          touch .env

          # Restore debug.keystore from base64 if present, or generate one
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fresh debug.keystore..."
              keytool -genkey -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace -Djava.awt.headless=true

      - name: Build APKs (Debug & Release)
        run: |
          ./gradlew assembleDebug --stacktrace -Djava.awt.headless=true
          ./gradlew assembleRelease --stacktrace -Djava.awt.headless=true

      - name: Clean CRC Repack, 4-Byte Zipalign & Dual-Sign APKs (v1 JAR + v2/v3 APK Schemes)
        run: |
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Build-Tools from: $BUILD_TOOLS_DIR"

          for apk in $(find app/build/outputs/apk -name "*.apk"); do
            echo "========================================"
            echo "Processing APK: $apk"

            # Step 1: Extract and repackage into a clean ZIP to guarantee 100% valid CRC32 tables
            python3 - "$apk" << 'EOF'
          import sys, zipfile, os

          apk_path = sys.argv[1]
          fixed_path = apk_path + ".fixed"

          with zipfile.ZipFile(apk_path, "r") as zin:
              with zipfile.ZipFile(fixed_path, "w") as zout:
                  for info in zin.infolist():
                      if info.filename.startswith("META-INF/") and (
                          info.filename.endswith(".SF") or info.filename.endswith(".RSA") or info.filename.endswith(".DSA") or info.filename == "META-INF/MANIFEST.MF"
                      ):
                          continue
                      data = zin.read(info.filename)
                      zinfo = zipfile.ZipInfo(filename=info.filename, date_time=(2026, 1, 1, 0, 0, 0))
                      zinfo.external_attr = 0o644 << 16
                      if info.filename == "resources.arsc" or info.filename.endswith((".mp4", ".webm", ".wav", ".png", ".jpg", ".webp")):
                          zinfo.compress_type = zipfile.ZIP_STORED
                      else:
                          zinfo.compress_type = zipfile.ZIP_DEFLATED
                      zout.writestr(zinfo, data)

          os.replace(fixed_path, apk_path)
          EOF

            # Step 2: 4-byte page alignment (mandatory before apksigner on Android 11-16 / SDK 30-36)
            "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$apk" "${apk}.aligned"
            mv "${apk}.aligned" "$apk"

            # Step 3: Sign with apksigner using --min-sdk-version 18 so BOTH v1 (META-INF/ANDROIDD.RSA) AND v2/v3 schemes are written cleanly
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --min-sdk-version 18 \
              --v1-signing-enabled true \
              --v1-signer-name ANDROIDD \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$apk"

            # Step 4: Verify v1 + v2 + v3 signatures and CRC table
            "$BUILD_TOOLS_DIR/apksigner" verify --min-sdk-version 18 --verbose "$apk"
            echo "========================================"
          done

      - name: Verify APK Integrity
        run: |
          echo "Checking APK outputs:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokEnhance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokEnhance-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
